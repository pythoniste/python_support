[project]
name = "reservation"
version = "1.0.0"
description = "Système de réservation de salles de réunion"
requires-python = ">=3.14"
authors = [{ name = "Formation Python" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = ["pydantic>=2", "pydantic[email]", "sqlalchemy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
reservation = "reservation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservation"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
