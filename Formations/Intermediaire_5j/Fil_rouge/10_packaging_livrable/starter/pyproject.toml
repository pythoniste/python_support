[project]
name = "reservation"
version = "1.0.0"
description = "Réservation de salles (fil rouge, étape 10)"
requires-python = ">=3.14"
dependencies = ["pydantic>=2", "pydantic[email]", "sqlalchemy>=2"]

# TODO: ajouter [project.scripts] et [project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
