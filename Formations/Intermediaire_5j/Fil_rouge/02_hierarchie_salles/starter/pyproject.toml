[project]
name = "reservation"
version = "0.2.0"
description = "Réservation de salles (fil rouge, étape 02)"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reservation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
