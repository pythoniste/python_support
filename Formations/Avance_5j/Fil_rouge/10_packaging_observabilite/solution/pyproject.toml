[project]
name = "pipeline"
version = "1.0.0"
description = "Pipeline de donnees asynchrone - Fil rouge Avance 5j"
requires-python = ">=3.14"
authors = [{ name = "Formation Python" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = ["aiofiles>=24.1", "cryptography>=44", "structlog>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
pipeline = "pipeline.__main__:main"

[project.entry-points."pipeline.plugins"]
moving_average = "pipeline.plugins.moving_average:MovingAveragePlugin"
anomaly_detector = "pipeline.plugins.anomaly_detector:AnomalyDetectorPlugin"
unit_converter = "pipeline.plugins.unit_converter:UnitConverterPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
