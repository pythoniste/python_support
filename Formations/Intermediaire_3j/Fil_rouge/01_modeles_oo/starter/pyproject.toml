[project]
name = "inventaire"
version = "0.1.0"
description = "Inventaire IT (fil rouge, étape 01)"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventaire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
