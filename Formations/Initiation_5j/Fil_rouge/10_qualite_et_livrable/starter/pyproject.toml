[project]
name = "bibliotheque"
version = "1.0.0"
description = "Gestionnaire de bibliothèque personnelle"
requires-python = ">=3.14"
authors = [{ name = "Formation Python" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bibliotheque = "bibliotheque.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliotheque"]
