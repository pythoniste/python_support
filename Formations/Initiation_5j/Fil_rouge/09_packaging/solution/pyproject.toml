[project]
name = "bibliotheque"
version = "0.9.0"
description = "Gestionnaire de bibliothèque personnelle (fil rouge, étape 09)"
requires-python = ">=3.14"
authors = [{ name = "Formation Python" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bibliotheque = "bibliotheque.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliotheque"]
